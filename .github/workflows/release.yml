name: Release package
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: ./build-package.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.txz
          generate_release_notes: true
